claims:
  - id: abstract-records
    kind: computation
    passage: "An empty region in a map of ceramic shapes can invite a historical explanation: perhaps potters could not make those forms, had no use for them, or preferred something else. The map alone cannot distinguish these possibilities. We separate geometrically describable forms, forms achievable under specified production conditions, historically made forms, and recorded observations. A reproducible study of 917 archived Sue-ware point clouds examines the last distinction. It compares distance-distribution descriptors, principal components and a compact autoencoder under missing geometry, sampling noise and alternative normalizations. In a fixed held-out comparison, randomly removing half the points preserves 34.3% of the descriptor map's ten-neighbour relationships; removing a contiguous half preserves 9.2%. Ordinary principal-component compression preserves 99.0% of the complete-data neighbourhoods, while whitening introduces substantial instability. These findings concern this recording and representation pipeline, not ceramic form in general. A separate construction demonstrates that identical observed profile segments can belong to geometrically different complete forms. Together, the argument and study specify what a broader computational account of making would need: an explicit observation model, production evidence independent of the shape representation, and historical comparisons that remain defensible when the record changes."
    evidence:
      file: "simulation/output/results.json"
      run_id: "measurement"
      pointer: "/dataset/records"
      reported: "917"
      scale: 1
      decimals: 0
      units: "point-cloud records"
      conditions: "Pinned CeramicNet position records loaded after duplicate-array check."
