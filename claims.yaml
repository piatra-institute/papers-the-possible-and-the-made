  - id: scope-of-a-map
    kind: definition
    passage: "Computational morphospaces are useful precisely because they make relationships available for inspection. A morphospace is a representation in which objects are located according to measured or inferred features; distance expresses a chosen kind of difference. It can assist retrieval, expose inconsistencies in a classification, or make a comparison reproducible. These are worthwhile achievements even when the coordinates have no direct causal meaning."
    rationale: "Working definition; distances express the selected representation, not an independently established causal metric."
  - id: conditional-feasibility
    kind: definition
    passage: "Within a chosen $G$, define $F(m,p,k,e)$ as the forms achievable with material conditions $m$, a production procedure $p$, a specified range of skill $k$, and an operating environment $e$. “Achievable” needs an operational meaning: for example, successful production to a declared tolerance at a stated frequency. A single exceptional success and reliable workshop production answer different questions. Their feasible regions need not coincide."
    rationale: "Feasibility is explicitly conditional on material, procedure, skill range and environment; successful production requires a declared operational criterion."
  - id: non-nesting
    kind: interpretation
    passage: "These distinctions should not be pictured as four universally nested sets. A historical object may fall outside the representation altogether; an observed reconstruction may be a geometry no one ever made. At a fixed time and under fully specified production conditions, actual production provides evidence of feasibility. Across changing conditions and lossy representations, that relation has to be established rather than assumed."
    rationale: "A lossy representation and a reconstructed record need not be subsets of historical production. Conditional production witnesses feasibility only under its actual conditions."
  - id: two-models
    kind: definition
    passage: "Here $g$ is a form, $D$ its record, and $O$ describes recording and preservation conditions. The second expression concerns the historical distribution of forms given production conditions $X$ and historical circumstances $H$. These expressions are a division of questions, not a fitted causal model. Different combinations of production, selection and recording can induce the same observed distribution."
    rationale: "Notation divides observation from historical explanation. Neither probability distribution is fitted in this study."
  - id: function-circularity
    kind: interpretation
    passage: "Function presents a related problem. If a vessel is called a storage jar because of its geometry, and a model subsequently predicts “storage” from that geometry, the prediction can reproduce the assignment rule without independently recovering use. Residue, use-wear, context or other evidence would have to carry the independent part of that inference. Geometric, functional and manufacturing similarities may overlap, but there is no reason to identify them by definition."
    rationale: "Predicting a geometry-assigned label may reproduce the label rule. Independent use evidence is proposed, not claimed to be available in this corpus."
  - id: prior-profile-mapping
    kind: source
    passage: "There is already substantial work on representing and comparing ceramic geometry. Parisotto and colleagues use a variational autoencoder and hierarchical clustering to assist the matching of Roman potsherd profiles. Their ROCOPOT material comes from published corpora, separates fragment types, and focuses the analysis on rims. Archaeological inspection remains part of evaluating the proposed matches [@parisotto2022, secs. 2 and 4.5]. A new embedding, by itself, would therefore make a weak claim to novelty."
    evidence:
      citation_id: "parisotto2022"
      locator: "Sections 2 and 4.5"
      verified: true
      verification_note: "Read the corpus description and archaeological evaluation: ROCOPOT uses published fragment profiles, restricts the matching analysis to rims, and includes archaeological inspection. No complete-vessel feasibility claim is attributed."
  - id: prior-selection
    kind: source
    passage: "That study also shows why documentation belongs inside the scientific question. The profiles needed processing to reconcile presentation differences, and the dataset construction excluded some one-of-a-kind profiles [@parisotto2022, sec. 2]. Such decisions can be appropriate for matching. Their consequences change when the question becomes the occupation of an entire space, especially its rare or empty regions. Suitability for retrieval is not automatically suitability for estimating historical prevalence."
    evidence:
      citation_id: "parisotto2022"
      locator: "Section 2, dataset construction"
      verified: true
      verification_note: "The inspected description discusses preprocessing publication profiles and excluding one-of-a-kind profiles; consequences for prevalence are our interpretation."
  - id: d2-precedent
    kind: source
    passage: "Shape distributions offer a comparatively transparent representation. Osada and colleagues describe signatures formed from distributions of geometric measurements, including distances between pairs of surface points [@osada2002, pp. 812-813]. These distances are invariant to translation and rotation. They also discard the arrangement of the pairs. The resulting signature is useful because it compresses an object into something readily compared; the compression is also a limit on what can be reconstructed from it."
    evidence:
      citation_id: "osada2002"
      locator: "Introduction and shape functions; pp. 807-809, 812-813"
      verified: true
      verification_note: "Read author-hosted PDF. D2 is a distribution of distances between random surface points. Our quantiles sample supplied points, not an area-uniform surface reconstruction."
  - id: disentanglement
    kind: source
    passage: "Learned coordinates introduce additional choices. Their variation may combine scale, preservation, recording style and features of interest. Locatello and colleagues establish limits on recovering disentangled factors through unsupervised learning without inductive assumptions [@locatello2019]. That result does not prohibit useful representations. It does caution against naming an axis “skill” or “function” solely because objects are ordered along it. Such names require evidence outside the optimization objective."
    evidence:
      citation_id: "locatello2019"
      locator: "Abstract, impossibility/result statements"
      verified: true
      verification_note: "Read PMLR abstract and bibliographic record. The statement concerns unsupervised disentanglement absent inductive biases; the manuscript does not extend the theorem to all geometric explanation."
  - id: process-observations
    kind: source
    passage: "There is a more productive route from form toward making. Nonaka and colleagues examine contemporary potters reproducing target forms, recording both final shapes and trajectories of formation. Their analyses find individual and community differences in those trajectories [@nonaka2024, Results]. The process observations make a different question available from the one answered by a static collection. They still do not enumerate all feasible vessels or isolate every influence on skill. They demonstrate the value of observing production directly."
    evidence:
      citation_id: "nonaka2024"
      locator: "Abstract, Results on individual/community trajectories, Methods"
      verified: true
      verification_note: "Read the primary PMC article sections. Potters reproduce target forms; intermediate shape trajectories support restricted individual/community comparisons, not an exhaustive feasible frontier."
  - id: archive-provenance
    kind: source
    passage: "The input is the publicly released CeramicNet supplement for Sue ware from Japan [@tatsuda2026]. The selected repository version contains 917 point-cloud records, each with 1024 points and five supplied morphological categories. These comprise bowls, dish bodies, dish bodies with ring bases, dish caps and plates. We use positions, exclude the supplied surface normals, and leave the separate upside-down copies outside the experiment."
