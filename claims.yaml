    kind: computation
    passage: "Compression need not add much damage. Ordinary PCA retains 99.0% of the complete descriptor map's ten-neighbour relationships on this split. Its half-clipping overlap is 9.2%, essentially the same descriptive result as the full descriptor. This is evidence that a modest linear representation can preserve the relationships available in these inputs. It does not establish that eight coordinates suffice for all ceramic geometries."
    evidence:
      file: "simulation/output/results.json"
      run_id: "measurement"
      pointer: "/headline/clip_half_pca_unwhitened/overlap"
      reported: "9.2%"
      scale: 100
      decimals: 1
      units: "percent ten-neighbour overlap"
      conditions: "First split (seed 17), observed-radius normalization, zero coordinate noise, held-out records; paired comparison against the complete-input map."
  - id: whitened-resampling
    kind: computation
    passage: "Whitening tells a different story. Resampling the pairs on unchanged complete clouds leaves only 13.8% of the whitened PCA map's neighbours intact. Giving low-variance directions substantial weight can promote sampling differences into geometric distinctions. Treating this as a general failure of principal components would miss the control: the unwhitened map behaves very differently."
    evidence:
      file: "simulation/output/results.json"
      run_id: "measurement"
      pointer: "/sampling_controls/13/overlap"
      reported: "13.8%"
      scale: 100
      decimals: 1
      units: "percent ten-neighbour overlap"
      conditions: "Seed 17, observed normalization; unchanged complete inputs, independent descriptor pair sample, whitened PCA."
  - id: autoencoder-clipping
    kind: computation
    passage: "The autoencoder supplies no rescue from severe missing geometry in this comparison. Its normalized half-clipping overlap is 8.4%. This is neither an estimate of the best attainable neural performance nor a test of the published CeramicNet classifier. It is a bounded comparison using a compact model on the same descriptors. Different inputs, objectives or training distributions could produce different results."
    evidence:
      file: "simulation/output/results.json"
      run_id: "measurement"
      pointer: "/headline/clip_half_autoencoder/overlap"
      reported: "8.4%"
      scale: 100
      decimals: 1
      units: "percent ten-neighbour overlap"
      conditions: "First split (seed 17), observed-radius normalization, zero coordinate noise, held-out records; paired comparison against the complete-input map."
  - id: raw-normalization
    kind: interpretation
    passage: "Normalization changes the interpretation as well as the numbers. In the scale-preserving descriptor, half-clipping retains roughly a third to two-fifths of neighbourhoods across splits. That greater stability can reflect size relationships which normalization intentionally removes. It should not be called superior historical recovery without deciding whether size is part of the question. A large bowl and a small bowl may be close in relative shape and far apart in capacity, handling and production demands."
    rationale: "All three raw-coordinate descriptor half-clipping rows preserve 33.7-39.8% of neighbours (rounded). Greater stability can preserve size rather than relative shape; superiority for historical recovery is not inferred."
  - id: synthetic-volume
    kind: computation
    passage: "They coincide throughout the observed interval $z\\geq 0.6$. Below it, the second profile broadens. Numerical integration of $\\pi r(z)^2$ gives a 23.9% difference in enclosed volume despite zero difference on the observed interval. This is enclosed geometric volume, not usable vessel capacity: no inner wall or thickness has been specified."
    evidence:
      file: "simulation/output/results.json"
      run_id: "measurement"
      pointer: "/synthetic/relative_volume_difference"
      reported: "23.9%"
      scale: 100
      decimals: 1
      units: "percent relative enclosed geometric volume"
      conditions: "Numerical integration of pi r(z)^2 over [0,1] for the two declared synthetic rotational profiles."
  - id: synthetic-identifiability
    kind: interpretation
    passage: "A trained model may consistently prefer one completion. That consistency expresses information in its prior or training distribution; it does not make the missing interval observed. In a suitable setting, the prior can be justified. Nearby finds, known production sequences or independently established types may narrow the alternatives. The resulting claim should identify which evidence did the narrowing."
    rationale: "The two explicitly constructed profiles agree exactly for z >= 0.6; synthetic/observed_max_difference is zero and covered by a unit test. Missing-body preference therefore requires a prior or external evidence. No manufacturability or usable-capacity claim."
  - id: propagate-completions
    kind: normative
    passage: "The appropriate response is to propagate plausible alternatives into the historical comparison. If a conclusion survives all completions supported by the evidence, it has a different status from one that depends on a single convenient reconstruction. Where the alternatives are too broad, a local measurement of the preserved part may support a narrower but more defensible comparison."
    rationale: "Proposed inference practice: retain alternatives compatible with external evidence and qualify conclusions that depend on imputation."
  - id: production-evidence
    kind: normative
    passage: "Evidence for a manufacturing frontier should include attempts beyond already occupied forms. Otherwise, a model trained on successes can confuse the boundary of a tradition with the boundary of a process. Controlled attempts would need to record the target geometry, material preparation, forming method, practitioner experience, tolerances and outcomes. Failures matter, but their interpretation also needs care: one failed attempt does not establish impossibility, and a success under substantially different conditions does not demonstrate historical availability."
    rationale: "Proposed future experiment including attempts, conditions and outcomes, not a claim that the present point-cloud study observed production."
  - id: historical-evidence
    kind: interpretation
    passage: "Historical occupation requires a further comparison. Even when several forms are demonstrably feasible, their observed frequencies may reflect trade, use, teaching or selective survival. A convincing test should contrast explanations that predict different observations. A change in clay access might predict altered material composition alongside altered form; an explanation based on documentation practice might predict changes across publications rather than production contexts. A residual in a geometric model is not, by elimination, culture."
    rationale: "Geometric residuals cannot identify culture without discriminating observations. Material access and documentation examples are hypothetical rival predictions."
  - id: source-group-transfer
    kind: normative
    passage: "Nor should repeated observations inflate the evidence. Multiple scans, fragments, views or reconstructions of one object belong to one source group. When a claim concerns transfer between workshops or communities, holding out randomly chosen records is insufficient. The relevant historical grouping must itself be held out, with enough independent groups to make the comparison meaningful."
    rationale: "Evaluation grouping should follow the intended unit of historical generalization, rather than treating views or reconstructions as independent."
  - id: hyperparameters
    kind: assumption
    passage: "The archived implementation pins the source revision and verifies every downloaded Git blob before assembling the data archive. Analyses run without network access thereafter. Each descriptor uses 8192 sampled pairs and 64 quantiles spanning probabilities 0.01 to 0.99. PCA retains eight components. The autoencoder has widths 64-32-8-32-64, tanh hidden activations, Adam optimization and validation-based early stopping. Input and latent standardization use training records only; ordinary PCA leaves its component variances intact."
    rationale: "Technical design is recorded in study.py, locked dependencies and protocol: descriptor sampling, network and normalization choices are not empirically calibrated optima."
  - id: treatment-grid
    kind: assumption
    passage: "Point loss is tested at 0%, 25%, 50% and 75%. Noise standard deviations are 0%, 0.25% and 1% of the complete cloud's bounding-box diagonal. That diagonal defines the experimental treatment and is not supplied as an extra predictor. Mask direction, subsampling and perturbations are fixed by object; seeds 17, 29 and 43 control the three splits and model fits. All complete and perturbed records, including oracle normalization and the original whitened PCA, contribute to the released result tables. There is no selection of the best split."
    rationale: "Fixed 0/25/50/75% loss and 0/0.25/1% bounding-box noise, with seeds 17/29/43; full-reference diagonal sets treatment magnitude only."
  - id: uncertainty-limit
    kind: interpretation
    passage: "The conditional intervals use 1000 bootstrap resamples of object-level overlap values. Pairwise distances are dependent, and no significance test treating all pairs as independent observations is used. The sampling and compression controls were added as recorded diagnostics after the first run. Code, protocol amendments, exact splits, machine-readable results and execution receipts accompany the manuscript."
    rationale: "1000 object-row bootstrap samples against a fixed gallery; dependent pair distances are not treated as independent observations. Conditional intervals do not quantify cross-population uncertainty."
runs:
  - id: measurement
    required: true
    record: verification/measurement.json
