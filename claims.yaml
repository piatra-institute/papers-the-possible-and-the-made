  - id: archive-limits
    kind: interpretation
    passage: "The files are reference observations, not certified complete original vessels. No exact duplicate position arrays were found. Filename-derived source identifiers are kept together during splitting, but the archive does not establish the workshop, potter or site independence needed for a cross-cultural generalization. Nor do we interpret its category labels as social groups. The result concerns sensitivity within this collection."
    rationale: "Exact-array duplicate check found none; filename source groups are not evidence of archaeological independence. Split group IDs remain in output/splits.json."
  - id: descriptor-definition
    kind: definition
    passage: "For each cloud, the representation begins with 64 quantiles of distances between sampled pairs of points. This adapts the D2 idea to supplied point clouds. Sampling these recorded points is not equivalent to sampling a reconstructed surface uniformly by area: the acquisition and resampling density already enters the measurement."
    rationale: "64 D2-style quantiles are a chosen descriptor; acquisition density remains part of the measure. The design and study.py specify 8192 sampled pairs."
  - id: scale-and-oracle
    kind: definition
    passage: "Two primary versions retain or remove scale. The first keeps archive coordinate scale, without claiming a verified conversion to physical units. The second divides distances by the maximum radius of the observed cloud about its centroid. The latter can compare relative shape, but its denominator changes when the observation loses an extremity. An additional oracle condition uses the complete cloud's radius to diagnose that effect. It is not a normalization that would be available from an unknown fragment alone."
    rationale: "Observed normalization uses only observed geometry; the complete-radius oracle is an explicit diagnostic and never an available fragment predictor."
  - id: split-and-training
    kind: assumption
    passage: "The full descriptors are compared with eight principal components and with a small autoencoder trained to reconstruct those descriptors. Training, validation and test records are separated before fitting either the input standardization or the learned representations. Each of three fixed splits has 549 training records, 184 validation records and 184 test records. Perturbations of an object stay in its split. Category labels are used to balance the split and describe dispersion, never as training targets."
    rationale: "Three fixed group/category-balanced 60/20/20 splits yield 549/184/184 records, independently checked against output/splits.json. All fitting uses training records; labels balance splits but are not prediction targets."
  - id: recording-interventions
    kind: assumption
    passage: "The interventions remove points uniformly or remove a contiguous portion through a half-space cut. Both retain the prescribed number of points. Separate conditions add coordinate noise. The same changed records are supplied to every representation, allowing paired comparisons. This is a controlled recording experiment: a planar cut is not a model of how archaeological ceramics fracture, and Gaussian noise does not represent every scanning error."
    rationale: "Prespecified uniform and half-space recording masks; these are sensitivity treatments, not calibrated archaeological fracture or scan-error distributions."
  - id: metrics
    kind: definition
    passage: "Each test map is compared with its own complete-input reference. We measure the overlap of each object's ten nearest neighbours, the rank correlation of all pairwise distances, and the ratio of mean within-category to between-category squared distances. The last quantity describes morphological archive labels. A change in it is not evidence of altered cultural diversity."
    rationale: "Local overlap, global distance rank and archive-label dispersion answer distinct questions; no category label is interpreted as a social population."
  - id: post-run-diagnostics
    kind: interpretation
    passage: "The initial protocol standardized each principal-component coordinate, giving components with small training variance comparable weight to dominant components. An independent descriptor-sampling control exposed substantial instability under this whitening. We therefore added ordinary unwhitened PCA while retaining the original results. We also compared each complete-data embedding with the complete descriptor map. These are diagnostic extensions made after the initial run; they are not presented as independently preregistered confirmations."
    rationale: "Protocol amendments disclose that descriptor resampling and unwhitened PCA/compression controls followed the initial run; original whitened results and prior execution receipts are retained."
  - id: uniform-overlap
    kind: computation
    passage: "For the first fixed split, randomly removing half the points leaves 34.3% of the observed-scale-normalized descriptor map's ten-neighbour relationships intact. The conditional object-row bootstrap interval is 31.6% to 37.4%. Removing a contiguous half leaves 9.2%, with an interval of 8.0% to 10.4%. The intervals resample object-level overlaps against a fixed gallery. They do not describe uncertainty across archaeological populations."
