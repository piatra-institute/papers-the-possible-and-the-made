  - id: pair-resampling
    kind: computation
    passage: "Sampling the descriptor itself also matters. On unchanged complete clouds, replacing the sampled point pairs retains 58.4% of the normalized descriptor map's neighbours, although its global distance ranking remains much more stable. Consequently, the loss under uniform thinning cannot all be attributed to missing geometry. Part reflects a finite, sampled descriptor operating among many close neighbours. The paired clipping result is more disruptive, but its magnitude is still specific to this pipeline."
